function localize(){document.documentElement.lang=lang;get('lang').value=lang;for(const e of document.querySelectorAll('[data-t]'))e.textContent=tr(e.dataset.t);if(get('nearby').options.length)get('nearby').options[0].textContent=tr('pick');wifiText(wifiState);zoneText(zoneState);renderZone()}
get('lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('cw-lang',lang)}catch(e){}localize()};localize();
function renderZone(){
    const select=get('zone');
    select.replaceChildren(...zones.map(z=>new Option(z[lang==='zh'?3:2],z[0])));
    const match=zones.find(z=>z[0]===selectedZone.zoneId&&z[1]===selectedZone.zone)
        ||zones.find(z=>selectedZone.zone===480&&!selectedZone.zoneId&&z[0]==='China Standard Time')
        ||zones.find(z=>!selectedZone.zoneId&&z[1]===selectedZone.zone);
    if(!match)select.add(new Option(tr('custom')+' / UTC '+(selectedZone.zone/60),''),0);
    select.value=match?match[0]:'';
}
get('zone').disabled=true;get('connect').disabled=true;
async function request(path, fields){const options=fields?{method:'POST',body:new URLSearchParams({...fields,token})}:{cache:'no-store'};const r=await fetch(path,options);if(!r.ok)throw Error(r.status);return r}
async function state(){return (await request('/status')).json()}
const nearby=get('nearby');
nearby.add(new Option(tr('pick'),''));
nearby.onchange=()=>{if(nearby.value)get('ssid').value=nearby.value};
async function scan(){
    const button=get('scan');
    button.disabled=true;
    wifiText('search');
    try{
        const data=await(await request('/scan')).text();
        const names=new Set();
        for(const entry of data.trim().split(/\s+/)){
            if(entry){try{names.add(decodeURIComponent(entry))}catch(e){}}
        }
        nearby.replaceChildren(new Option(tr('pick'),''));
        for(const name of names)nearby.add(new Option(name,name));
        nearby.disabled=!names.size;
        wifiText(names.size?'':'empty');
    }catch(e){wifiText('error')}finally{button.disabled=false}
}
get('scan').onclick=scan;
get('zone').onchange=async()=>{if(!zoneReady)return;const select=get('zone'), row=zones.find(z=>z[0]===select.value);if(!row)return;select.disabled=true;try{await request('/timezone',{minutes:row[1],id:row[0]});selectedZone={zoneId:row[0],zone:row[1]};zoneText('saved')}catch(e){zoneText('error');try{selectedZone=await state()}catch(e){}}finally{renderZone();select.disabled=false}};
get('wifi').onsubmit=async e=>{e.preventDefault();const b=get('connect');b.disabled=true;wifiText('join');try{await request('/wifi',{ssid:get('ssid').value,password:get('pwd').value});get('pwd').value='';for(let i=0;i<35;i++){await new Promise(r=>setTimeout(r,700));try{const s=await state();if(s.failed){wifiText('fail');return}if(s.ready){wifiText('ok');if(s.ap && s.ip)get('wifiStatus').append(' · '+s.ip);return}}catch(e){}}wifiText('fail')}catch(e){wifiText('error')}finally{b.disabled=false}};
state().then(s=>{token=s.token;selectedZone=s;renderZone();zoneReady=true;get('zone').disabled=false;get('connect').disabled=false;scan()}).catch(()=>wifiText('error'));
</script></html>
